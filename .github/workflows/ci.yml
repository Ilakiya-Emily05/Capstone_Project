name: CI

on:
  push:
    branches: [ main, sprint-4 ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd api-gateway
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          cd api-gateway
          pytest
